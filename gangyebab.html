<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맛도리 간계밥 레시피</title>
</head>
<body>
    <h1 id="title">맛도리 간계밥</h1>
        <li><a href="#ingredients">재료</a></li>
        <li><a href="#sequence">조리 순서</a></li>
    <p>간장과 계란을 밥에 섞어 먹는 <strong>간단 완성 요리</strong>입니다. 참기름을 넣으면<em> 고소한 맛</em>을 낼 수있습니다.</p>
        <img src="./img2/img2.png" alt="간장 계란밥" width="400" title="간장 계란밥">
        <figcaption>▲간장 계란밥</figcaption>
    </figure>
    <h2 id="ingredients">재료</h2>
    <ul>
    <li>계란 1개</li>
    <li>간장 20ml</li>
    <li>밥 400g</li>
    <li>참기름</li>
    </ul>
    <h2 id="sequence">조리순서</h2>
    <ol>1. 계란을 후라이팬으로 굽는다.</ol>
    <ol>2. 밥 위에 얹어 간장20ml를 붙는다.</ol>
    <ol>3. 참기름을 넣어준다.</ol>
    <ol>4. 섞어서 완성한다</ol>

</body>
</html>
